<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Unit Converter</title>
</head>
<body>
    <header>
        <form action="">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input id="input-value" type="number" value="20" />    
            <button>Convert</button>
        </form>
    </header>
    <main>
        <section class="length">
            <h2>Length (Meter/Feet)</h2>
            <p id="result-length">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
        </section>
        <section class="volume">
            <h2>Volume (Liters/Gallons)</h2>
            <p id="result-volume">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
        </section>
        <section class="mass">
            <h2>Mass (Kilograms/Pounds)</h2>
            <p id="result-mass">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
        </section>
    </main>
</body>
</html>
